services:
  test-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dcid-backend-sdk-test-server
    ports:
      - "8080:8080"
    environment:
      - DCID_API_KEY=${DCID_API_KEY}
      - DCID_ENVIRONMENT=${DCID_ENVIRONMENT:-dev}
      - DCID_BASE_URL=${DCID_BASE_URL:-http://host.docker.internal:5000/api}
      - PORT=8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - dcid-network

networks:
  dcid-network:
    driver: bridge



