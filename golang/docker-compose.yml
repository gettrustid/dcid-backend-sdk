services:
  test-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustid-sdk-test-server
    ports:
      - "8080:8080"
    environment:
      - TRUSTID_API_KEY=${TRUSTID_API_KEY}
      - TRUSTID_ENVIRONMENT=${TRUSTID_ENVIRONMENT:-dev}
      - TRUSTID_BASE_URL=${TRUSTID_BASE_URL:-http://host.docker.internal:5000/api}
      - PORT=8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - trustid-network

networks:
  trustid-network:
    driver: bridge



